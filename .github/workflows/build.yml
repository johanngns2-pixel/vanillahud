name: build
on: [push, workflow_dispatch]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - uses: gradle/actions/setup-gradle@v4
      - name: Build
        run: gradle build --no-daemon --stacktrace > build.log 2>&1
      - name: Smoke test
        if: always()
        continue-on-error: true
        env:
          VH_AUDIT: "1"
        run: |
          mkdir -p /tmp/lg
          sed -i 's/require = 0/require = 1/' src/main/java/de/vanillahud/mixin/*.java
          sudo apt-get update -qq && sudo apt-get install -y -qq xvfb libgl1-mesa-dri libglx-mesa0 >/dev/null 2>&1
          timeout 480 xvfb-run -a gradle runClient --no-daemon > smoke.log 2>&1 || true
          cp smoke.log /tmp/lg/ 2>/dev/null; cp run/logs/latest.log /tmp/lg/latest.log 2>/dev/null; cp run/crash-reports/*.txt /tmp/lg/ 2>/dev/null; true
      - name: Probe
        if: always()
        run: |
          mkdir -p /tmp/lg
          find ~/.gradle -name '*.jar' -size +50k 2>/dev/null | sort > /tmp/lg/jars.txt
          CP=$(grep -E 'minecraftMaven|fabric-api|fabric-.*-v[0-9]|fabric-loader|remapped' /tmp/lg/jars.txt | grep -vE 'sources|intermediary|-client-extra' | tr '\n' ':')
          : > /tmp/lg/probe.txt
          while read c; do echo "=== $c" >> /tmp/lg/probe.txt; javap -p -cp "$CP" "$c" >> /tmp/lg/probe.txt 2>&1; done < .github/probe.txt; true
      - name: Bytecode probe
        if: always()
        run: |
          CP=$(grep -E 'minecraftMaven' /tmp/lg/jars.txt | grep -vE 'sources|intermediary' | tr '\n' ':')
          javap -p -c -cp "$CP" net.minecraft.client.renderer.entity.EntityRenderer | grep -nE "nameTag|extractRenderState|getNameTag" > /tmp/lg/bytecode.txt 2>&1 || true
      - name: Overlay probe
        if: always()
        run: |
          CP=$(grep -E 'minecraftMaven' /tmp/lg/jars.txt | grep -vE 'sources|intermediary' | tr '\n' ':')
          { javap -p -c -constants -cp "$CP" net.minecraft.client.renderer.texture.OverlayTexture; echo ======LER; javap -p -c -cp "$CP" net.minecraft.client.renderer.entity.LivingEntityRenderer | grep -nE "getOverlayCoords|OverlayTexture|NO_OVERLAY|pack" ; echo ======ARMOR; javap -p -c -cp "$CP" net.minecraft.client.renderer.entity.layers.HumanoidArmorLayer | grep -nE "OverlayTexture|NO_OVERLAY|getOverlay|overlay|lightCoords|submit|renderArmor" ; echo ======EQ; javap -p -c -cp "$CP" net.minecraft.client.renderer.entity.layers.EquipmentLayerRenderer | grep -nE "OverlayTexture|NO_OVERLAY|overlay|Overlay"; } > /tmp/lg/overlay.txt 2>&1 || true
      - name: Class lists
        if: always()
        run: |
          for j in $(grep -E 'fabric-rendering|fabric-events' /tmp/lg/jars.txt); do unzip -l "$j" | awk '{print $4}' | grep class >> /tmp/lg/fabric-classes.txt; done
          M=$(grep minecraft-merged-deobf /tmp/lg/jars.txt | head -1)
          unzip -l "$M" | awk '{print $4}' | grep -E 'Fog|Outline|DebugScreen|particle/|Particle|Shape|RenderType|NameTag|Nametag|Overlay' > /tmp/lg/mc-classes.txt
      - name: Publish log
        if: always()
        run: |
          mkdir -p /tmp/lg; cp build.log /tmp/lg/ 2>/dev/null; cp $(ls build/libs/vanillahud-*.jar | grep -v sources | head -1) /tmp/lg/vanillahud.jar 2>/dev/null || true
          cd /tmp/lg && git init -q -b buildlog && git config user.name ci && git config user.email ci@example.com
          git add -A && git commit -q -m "build log" --allow-empty
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" buildlog
      - uses: actions/upload-artifact@v4
        with:
          name: vanillahud-jar
          path: build/libs/vanillahud-1.1.0.jar
