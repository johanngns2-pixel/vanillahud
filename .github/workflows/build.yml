name: build
on: [push, workflow_dispatch]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - uses: gradle/actions/setup-gradle@v4
      - name: Build
        run: gradle build --no-daemon --stacktrace > build.log 2>&1 || { grep -E 'error:|FAILED|What went wrong' -A3 build.log | head -80; exit 1; }
      - name: Probe
        if: always()
        continue-on-error: true
        run: |
          mkdir -p /tmp/lg
          find ~/.gradle -name '*.jar' -size +50k 2>/dev/null | sort > /tmp/lg/jars.txt
          CP=$(grep -E 'minecraftMaven|fabric-api|fabric-.*-v[0-9]|fabric-loader|remapped' /tmp/lg/jars.txt | grep -vE 'sources|intermediary|-client-extra' | tr '\n' ':')
          : > /tmp/lg/probe.txt
          for j in $(echo $CP | tr ':' ' '); do unzip -Z1 $j 2>/dev/null | grep -iE 'fog|nametag|particle/|debug/' ; done | sort -u > /tmp/lg/classes.txt
          while read c; do echo "=== $c" >> /tmp/lg/probe.txt; javap -p -cp "$CP" "$c" >> /tmp/lg/probe.txt 2>&1; done < .github/probe.txt
      - name: Publish log
        if: always()
        run: |
          mkdir -p /tmp/lg && cp build.log /tmp/lg/ 2>/dev/null; cp build/libs/vanillahud-1.0.0.jar /tmp/lg/ 2>/dev/null || true
          cd /tmp/lg && git init -q -b buildlog && git config user.name ci && git config user.email ci@example.com
          git add -A && git commit -q -m "build log" --allow-empty
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" buildlog
      - uses: actions/upload-artifact@v4
        with:
          name: vanillahud-jar
          path: build/libs/vanillahud-1.0.0.jar
